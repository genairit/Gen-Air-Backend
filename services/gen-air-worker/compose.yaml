name: gen-air-worker-local
services:
  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: worker
      RABBITMQ_DEFAULT_PASS: local-worker-only
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
  worker:
    build: .
    environment:
      RABBITMQ_URL: amqp://worker:local-worker-only@rabbitmq:5672?heartbeat=30
      WORKER_QUEUE_PREFIX: genair.worker.v1
      WORKER_PREFETCH: 1
      PORT: 3001
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    init: true
    stop_grace_period: 60s
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  rabbitmq-data:
